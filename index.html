<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Film Camera Studio</title>
<meta name="theme-color" content="#141412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Film Cam">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="modeBtn" type="button">Sửa ảnh</button>
    <span class="title" id="title">Film Camera Studio</span>
    <button class="icon-btn" id="flipBtn" type="button" aria-label="Đổi camera trước/sau">⇄ Cam</button>
  </header>

  <main class="finder" id="finder">
    <canvas id="view" aria-label="Khung ngắm có áp công thức màu"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <div class="overlay" id="overlay" hidden>
      <p id="overlayText">Đang mở camera…</p>
      <button class="btn" id="retryBtn" type="button" hidden>Thử lại</button>
    </div>
    <div class="hud"><span id="readout"></span><span id="counter"></span></div>
    <div class="flash" id="flash"></div>
  </main>

  <nav class="strip" id="strip" aria-label="Công thức màu"></nav>

  <section class="panel" id="panel" hidden>
    <div class="grid">
      <div class="ctl"><label for="ev">Phơi sáng <output id="evO"></output></label><input id="ev" type="range" min="-2" max="2" step="0.1"></div>
      <div class="ctl"><label for="hl">Tông sáng <output id="hlO"></output></label><input id="hl" type="range" min="-2" max="4" step="0.5"></div>
      <div class="ctl"><label for="sh">Tông tối <output id="shO"></output></label><input id="sh" type="range" min="-2" max="4" step="0.5"></div>
      <div class="ctl"><label for="sat">Độ màu <output id="satO"></output></label><input id="sat" type="range" min="-4" max="4" step="1"></div>
      <div class="ctl"><label for="cd">Chiều sâu sắc độ <output id="cdO"></output></label><input id="cd" type="range" min="0" max="2" step="0.1"></div>
      <div class="ctl"><label for="gr">Hạt phim <output id="grO"></output></label><input id="gr" type="range" min="0" max="1" step="0.05"></div>
      <div class="ctl"><label for="wr">Ấm ↔ đỏ (R) <output id="wrO"></output></label><input id="wr" type="range" min="-9" max="9" step="1"></div>
      <div class="ctl"><label for="wb">Lạnh ↔ xanh (B) <output id="wbO"></output></label><input id="wb" type="range" min="-9" max="9" step="1"></div>
      <div class="ctl"><label>Cỡ hạt</label><div class="seg" id="gsize"><button type="button" data-v="0.8">Nhỏ</button><button type="button" data-v="1.6">Lớn</button></div></div>
      <div class="ctl"><label>Công thức</label><div class="seg"><button type="button" id="saveRecipe">Lưu thành của tôi</button><button type="button" id="resetRecipe">Đặt lại</button></div></div>
    </div>
  </section>

  <footer class="bar">
    <button class="thumb" id="thumb" type="button" aria-label="Xem ảnh vừa chụp"></button>
    <button class="shutter" id="shutter" type="button" aria-label="Chụp ảnh"></button>
    <div class="side">
      <button class="icon-btn" id="dialBtn" type="button" aria-expanded="false">Chỉnh</button>
      <button class="icon-btn hold" id="holdBtn" type="button">Gốc</button>
    </div>
  </footer>
  <input id="file" type="file" accept="image/*" hidden>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <img id="sheetImg" alt="Ảnh vừa chụp">
    <p class="hint" id="sheetHint">Nhấn “Lưu / Chia sẻ” rồi chọn “Lưu hình ảnh”. Hoặc nhấn giữ ảnh để lưu.</p>
    <div class="row">
      <button class="btn primary" id="shareBtn" type="button">Lưu / Chia sẻ</button>
      <button class="btn" id="closeSheet" type="button">Đóng</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
